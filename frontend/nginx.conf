server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API again if Compose replaces the container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location ~ ^/api(?:/|$) {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
