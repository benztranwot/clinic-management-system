name: Docker build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-images:
    name: Build container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build every image Compose uses so a broken Dockerfile fails before deployment.
      - name: Build the API runtime image
        run: docker build --file backend/Dockerfile --target runtime --tag clinic-api:ci .

      - name: Build the migration image
        run: docker build --file backend/Dockerfile --target migrations --tag clinic-migrate:ci .

      # Placeholder public Auth0 values; the image is not published.
      - name: Build the web image
        run: >
          docker build frontend --tag clinic-web:ci
          --build-arg VITE_AUTH0_DOMAIN=ci.example.auth0.com
          --build-arg VITE_AUTH0_CLIENT_ID=ci-client-id
          --build-arg VITE_AUTH0_AUDIENCE=https://clinic-management-api

      - name: Check the web server configuration
        run: |
          # The container must refuse to start without an Auth0 domain.
          if docker run --rm clinic-web:ci nginx -t; then
            echo "The web image started without AUTH0_DOMAIN." >&2
            exit 1
          fi

          # With settings, the rendered nginx configuration must be valid.
          docker run --rm --add-host api:127.0.0.1 -e AUTH0_DOMAIN=ci.example.auth0.com clinic-web:ci nginx -t

      - name: Check web proxy responses
        shell: bash
        run: |
          cleanup() {
            docker rm -f clinic-web-check >/dev/null 2>&1 || true
            docker network rm clinic-web-check >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create clinic-web-check

          # A stub API exercises nginx forwarding without an Auth0 tenant or database.
          docker run -d --name clinic-web-check --network clinic-web-check --network-alias api \
            -p 127.0.0.1::80 -e AUTH0_DOMAIN=ci.example.auth0.com --entrypoint sh clinic-web:ci -c '
              echo "server { listen 8080; location /api/health { return 200 ready; } }" > /etc/nginx/conf.d/stub-api.conf
              exec /docker-entrypoint.sh nginx -g "daemon off;"
            '

          base_url="http://$(docker port clinic-web-check 80/tcp)"
          test "$(curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$base_url/api/health")" = ready
          test "$(docker exec clinic-web-check wget -qO- http://127.0.0.1:8081/api/health/ready)" = ready
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base_url/api/health/ready")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base_url/api/Health/Ready/")" = 404

          asset="$(docker exec clinic-web-check find /usr/share/nginx/html/assets -name '*.js' | sed -n '1p')"
          test -n "$asset"
          curl -fsS -D asset-headers.txt -o /dev/null "$base_url${asset#/usr/share/nginx/html}"
          grep -qi '^Cache-Control:.*immutable' asset-headers.txt

          test "$(curl -sS -D missing-asset-headers.txt -o /dev/null -w '%{http_code}' "$base_url/assets/missing.js")" = 404
          grep -qi '^X-Content-Type-Options: nosniff' missing-asset-headers.txt
          if grep -qi '^Cache-Control:.*immutable' missing-asset-headers.txt; then
            echo "A missing asset received the immutable cache policy." >&2
            exit 1
          fi

          curl -fsS -H 'X-Forwarded-Proto: https' -D untrusted-headers.txt -o /dev/null "$base_url/"
          if grep -qi '^Strict-Transport-Security:' untrusted-headers.txt; then
            echo "nginx accepted the scheme from an untrusted peer." >&2
            exit 1
          fi

          trusted_headers="$(docker exec clinic-web-check wget -S -O /dev/null \
            --header='X-Forwarded-Proto: https' --header='X-Forwarded-For: 192.0.2.10' http://127.0.0.1/ 2>&1)"
          grep -qi 'Strict-Transport-Security:' <<< "$trusted_headers"
